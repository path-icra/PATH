  - title: Reproducibility
    text: |
      Code will be released at the anonymized repository linked above. The setup used in our
      experiments is summarized below.

      | Step | Setup |
      |------|-------|
      | 1 | **Hardware.** A humanoid platform with a parallel-jaw gripper, one head-mounted RGB-D camera, and two wrist-mounted RGB-D cameras, driven by an onboard compute module. |
      | 2 | **XR interface.** Operator commands are streamed from a WebXR-based client to the onboard computer over a local network. |
      | 3 | **Belief and reference generation.** Belief inference and compliant reference generation run on a remote workstation and are transmitted at the full control rate. |
      | 4 | **Evaluation protocol.** All baselines run under identical task setups; the full protocol and metrics are described in the paper. |


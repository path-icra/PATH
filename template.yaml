abstract: |
  Humanoid teleoperation is an important tool for collecting whole-body manipulation demonstrations for large-scale robot learning. However, most existing systems mainly focus on reproducing human motion. For precise manipulation, even small errors in contact location or hand orientation can cause the robot to miss the intended interaction.

  We propose **PATH**, a belief-guided shared control framework that continuously infers fine-grained manipulation intent from operator motion and 3-D scene geometry. PATH represents intent using an object belief, an object-conditioned contact belief, and a separate hand-approach orientation belief. It also uses an evidence-adaptive belief transition that adjusts belief switching according to belief-weighted evidence dispersion. The inferred intent is converted into a smooth task-space reference and mapped to executable humanoid arm commands through constrained bimanual inverse kinematics. This separates responsive intent estimation from smooth physical execution.

  Real-world humanoid manipulation experiments show that PATH reduces task completion time, translational and rotational end-effector path lengths, and trajectory jerk compared with matched teleoperation and conventional reference-generation baselines.

  **PATH combines evidence-adaptive intent inference with smooth shared references and constrained bimanual inverse kinematics.**


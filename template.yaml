  - title: Method
    text: |
      ## **Probabilistic Assistance for Teleoperation of Humanoid**

      - **Real-world demonstration**

        <p><strong>Bimanual intent inference during cup stacking.</strong> The left panels show intent inference for each hand; the right panel shows PATH executing the cup-stacking task.</p>

        <div class="uk-grid-medium uk-child-width-1-1 uk-child-width-1-2@m uk-flex-middle" uk-grid>
          <div>
            <figure class="uk-margin-remove">
              <video src="videos/cup_intent_right.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1" style="display: block; border-radius: 10px;" aria-label="Right hand intent inference"></video>
              <figcaption class="uk-margin-small-top"><strong>Right hand</strong><br><span class="uk-text-small">Manipulation intent inferred for the right hand.</span></figcaption>
            </figure>
            <figure class="uk-margin-medium-top uk-margin-remove-bottom">
              <video src="videos/cup_intent_left.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1" style="display: block; border-radius: 10px;" aria-label="Left hand intent inference"></video>
              <figcaption class="uk-margin-small-top"><strong>Left hand</strong><br><span class="uk-text-small">Manipulation intent inferred for the left hand.</span></figcaption>
            </figure>
          </div>
          <div>
            <figure class="uk-margin-remove">
              <video src="videos/PATH_cup_stack.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1" style="display: block; border-radius: 10px;" aria-label="PATH cup stacking execution"></video>
              <figcaption class="uk-margin-small-top"><strong>PATH — Cup stacking</strong><br><span class="uk-text-small">Bimanual execution with belief-guided assistance.</span></figcaption>
            </figure>
          </div>
        </div>

        <p><strong>Goal-directed bottle opening amid distractors.</strong> Even when several distracting objects are present on the table, PATH identifies the intended bottle, guides a precise grasp, and assists the opening task.</p>

        <div uk-slider="finite: true">
          <div class="uk-position-relative">
            <div class="uk-slider-container">
              <ul class="uk-slider-items uk-child-width-1-1 uk-child-width-1-2@s uk-child-width-1-3@m uk-grid-small">
                <li><video src="videos/real_bottle/bottle_2.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video></li>
                <li><video src="videos/real_bottle/bottle_3.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video></li>
                <li><video src="videos/real_bottle/bottle_4.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video></li>
                <li><video src="videos/real_bottle/bottle_5.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video></li>
              </ul>
            </div>
            <a class="uk-position-center-left uk-position-small uk-hidden-hover" href uk-slidenav-previous uk-slider-item="previous" aria-label="Previous demonstration"></a>
            <a class="uk-position-center-right uk-position-small uk-hidden-hover" href uk-slidenav-next uk-slider-item="next" aria-label="Next demonstration"></a>
          </div>
          <ul class="uk-slider-nav uk-dotnav uk-flex-center uk-margin-small-top"></ul>
        </div>

      ### **Hierarchical manipulation belief**

      <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-flex-middle" uk-grid>
        <div>
          <img src="hierarchical-manipulation-belief.gif" alt="Hierarchical manipulation belief animation" class="uk-width-1-1" />
        </div>
        <div>
          <video src="videos/PATH_cup_stack.mp4" loop muted playsinline uk-video="autoplay:inview" class="uk-width-1-1"></video>
        </div>
      </div>

      PATH factors position intent into an object belief and an object-conditioned contact belief, so contacts compete within each object. A separate orientation belief relates the commanded hand approach axis to scene planes, independently of the selected object.

      **Evidence-adaptive belief transition.** Belief-weighted evidence dispersion adjusts the mixture of persistence and switching transitions: greater dispersion increases switching weight. A predict-correct update combines this transition with the processed evidence, while nearby matched contacts retain their belief across geometry updates.

      - **Object and Object-Conditioned Contact Inference**

        <div class="uk-grid-small uk-flex-middle" uk-grid>
          <div class="uk-width-1-1 uk-width-3-5@m">
            <img src="data/path_contact_advantage_trial_013.gif" alt="Object-conditioned contact advantage inference" class="uk-width-1-1" />
          </div>
          <div class="uk-width-1-1 uk-width-2-5@m uk-flex uk-flex-middle">
            <div>
              <p><strong>Motion-consistent contact evidence.</strong> PATH evaluates each object-conditioned contact against the operator's current hand motion and task feasibility, then stabilizes the evidence over time before selecting the assisted target.</p>
            </div>
          </div>
        </div>

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-margin-small-top" uk-grid>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #16a34a; border-radius: 0.45rem;"><strong>Proximity</strong><br><span class="uk-text-small">Prioritizes contact points close to the current hand position.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #2563eb; border-radius: 0.45rem;"><strong>Directional intent</strong><br><span class="uk-text-small">Rewards candidates along operator-commanded hand motion; disabled at low hand speed.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #7c3aed; border-radius: 0.45rem;"><strong>Workspace feasibility</strong><br><span class="uk-text-small">Suppresses contact hypotheses outside the corresponding arm's reach.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #f97316; border-radius: 0.45rem;"><strong>Surface alignment</strong><br><span class="uk-text-small">Uses a reliable local normal to favor a compatible hand approach.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #64748b; border-radius: 0.45rem;"><strong>Temporal consistency</strong><br><span class="uk-text-small">Temporally smooths, scales, and clips evidence before belief updating.</span></div></div>
        </div>

      - **Orientation Inference**

        <div class="uk-grid-small uk-flex-middle" uk-grid>
          <div class="uk-width-1-1 uk-width-3-5@m">
            <img src="data/path_orientation_advantage_trial_013.gif" alt="Orientation-relation advantage inference" class="uk-width-1-1" />
          </div>
          <div class="uk-width-1-1 uk-width-2-5@m uk-flex uk-flex-middle">
            <div>
              <p><strong>Relation-aware orientation evidence.</strong> PATH continuously compares parallel and perpendicular hand-to-surface-normal relations, combining current alignment with the operator's rotational behavior rather than fixing one approach orientation.</p>
            </div>
          </div>
        </div>

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-margin-small-top" uk-grid>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #16a34a; border-radius: 0.45rem;"><strong>Geometric alignment</strong><br><span class="uk-text-small">Penalizes geometric relation error with a scaled Huber loss.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #7c3aed; border-radius: 0.45rem;"><strong>Stationary hold</strong><br><span class="uk-text-small">Rewards a well-aligned relation when angular speed falls below the stationary-hand threshold.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #2563eb; border-radius: 0.45rem;"><strong>Convergence</strong><br><span class="uk-text-small">Rewards angular motion that actively reduces relation error.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #f97316; border-radius: 0.45rem;"><strong>Normal-sign invariance</strong><br><span class="uk-text-small">Uses squared alignment to remain robust when a perceived normal flips sign.</span></div></div>
        </div>

      ### **Shared Reference Generation & Bimanual Control**

      - **Belief-Guided Shared Reference Generation**

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-flex-middle" uk-grid>
          <div>
            <img src="data/path_reference_relation_trial_013.gif" alt="PATH reference generation for trial 013" class="uk-width-1-1" />
          </div>
          <div>
            <img src="data/path_reference_relation_trial_006.gif" alt="PATH reference generation for trial 006" class="uk-width-1-1" />
          </div>
        </div>

        <div class="uk-flex uk-flex-center uk-flex-wrap uk-flex-middle uk-margin-small-top" style="gap: 1.1rem; font-size: 0.9rem;">
          <span><span style="color: #2ca25f; font-size: 1.25em;">●</span> Reference motion</span>
          <span><span style="color: #1976d2; font-size: 1.25em;">●</span> Gripper state</span>
          <span><span style="color: #f28e2b; font-size: 1.25em;">●</span> Bottle normal</span>
        </div>

        **Confidence-weighted shared targets.** A valid contact guides position when the hand is not holding an object; otherwise, the operator position command is retained. Orientation assistance blends the operator command with a minimum-rotation, relation-consistent target, weighted by belief confidence and detection-consistency gates. **Overdamped second-order reference dynamics** preserve reference pose and velocity across target changes, with exact discrete propagation and smoothly adjusted orientation parameters.

      - **Bimanual Humanoid Control**

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-flex-middle" uk-grid>
          <div>
            <img src="data/20260805_174753_static_ee_static_upper.gif" alt="G1 upper-body end-effector tracking" class="uk-width-1-1" />
          </div>
          <div class="uk-flex uk-flex-middle">
            <p class="uk-margin-remove"><strong>Joint nonlinear IK for coordinated assistance.</strong> PATH solves both 7-DoF arms together from the generated task-space references, balancing position and orientation tracking with joint-limit feasibility. <strong>Warm-started, smooth redundancy resolution</strong> regularizes the solution and penalizes inter-frame motion, yielding continuous, executable bimanual commands while locomotion remains independently controlled.</p>
          </div>
        </div>

  - title: Results
    text: |
      All charts show trial means; lower is better. Green highlights PATH. Results are conditioned on successful task completion, not success rates.

      ### **Which belief components matter?**
      On Bottle Opening, PATH reduces completion time by **34.8%** and normalized jerk by **81.4%** relative to unassisted teleoperation. Both position and orientation beliefs, together with the evidence-adaptive transition, contribute to the full method.
      <p class="uk-text-meta">30 successful trials per condition across three expert operators. Pos. = position belief; Ori. = orientation belief; Adapt. trans. = evidence-adaptive belief transition.</p>
      <img src="results/belief-ablation.svg" alt="Bottle Opening ablation: seven methods compared on completion time, normalized jerk, translation path, and rotation path; PATH has the lowest mean in each metric." class="uk-width-1-1" />

      ### **How should inferred intent become motion?**
      With identical belief estimation and downstream inverse kinematics, PATH's shared reference generation reduces completion time by **25.2%** and normalized jerk by **74.3%** relative to Alpha Blend + LPF.
      <p class="uk-text-meta">Separate Bottle Opening experiment: 30 successful trials per condition across three expert operators. Only reference generation differs between conditions. LPF = low-pass filter.</p>
      <img src="results/reference-generation.svg" alt="Reference generation: Alpha Blend, Alpha Blend plus LPF, and PATH compared on completion time, normalized jerk, translation path, and rotation path." class="uk-width-1-1" />

      ### **Comparison with teleoperation systems**
      On Sequential Cup Stacking, PATH reduces completion time by **22.2%** and normalized jerk by **66.4%** relative to the matched XR-Teleop baseline.
      <p class="uk-text-meta">15 successful trials per condition across three expert operators. XR-Teleop shares PATH's retargeting and IK pipeline without intent-guided assistance; SONIC and TWIST2 are system-level references.</p>
      <img src="results/teleoperation-comparison.svg" alt="Sequential Cup Stacking: SONIC, TWIST2, XR-Teleop, and PATH compared on completion time, normalized jerk, translation path, and rotation path." class="uk-width-1-1" />

      <p class="uk-text-meta">Jerk is the normalized, dimensionless trajectory-jerk metric, shown using the paper's ×10¹⁰ scale. All values are trial means.</p>


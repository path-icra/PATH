abstract: |
  Humanoid teleoperation is an important tool for collecting whole-body manipulation
  demonstrations for large-scale robot learning. However, most existing systems primarily focus on
  reproducing human motion, which may be insufficient for precise manipulation because small errors
  in contact location or hand orientation can prevent successful interaction.

  We propose **PATH**, a belief-guided shared-control framework that continuously infers
  fine-grained manipulation intent from operator motion and 3-D scene geometry. PATH represents
  intent at three levels: target object, object-conditioned interaction contact, and hand approach
  orientation. A hierarchical probabilistic belief estimator maintains these hypotheses over time,
  while an ambiguity-aware transition mechanism balances temporal persistence with rapid adaptation
  to changes in operator intent. The inferred intent is converted into a smooth task-space
  reference and mapped to executable humanoid arm commands through constrained bimanual inverse
  kinematics, separating responsive intent estimation from physical reference generation.

  Real-world humanoid manipulation experiments show that PATH reduces task completion time,
  corrective end-effector motion, and trajectory jerk compared with matched teleoperation and
  conventional reference-generation baselines.

  **PATH couples hierarchical object-contact-orientation belief inference with compliant shared-reference generation for smooth bimanual humanoid teleoperation.**

body:
  - title: Method
    text: |
      ## **Probabilistic Assistance for Teleoperation of Humanoid**

      - **Real-world demonstration**

        <p><strong>Goal-directed bottle opening amid distractors.</strong> Even when several distracting objects are present on the table, PATH identifies the intended bottle, guides a precise grasp, and assists the opening task.</p>

        <div uk-slider="finite: true">
          <div class="uk-position-relative">
            <div class="uk-slider-container">
              <ul class="uk-slider-items uk-child-width-1-1 uk-child-width-1-2@s uk-child-width-1-3@m uk-grid-small">
                <li><video src="videos/real_bottle/bottle_2.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video></li>
                <li><video src="videos/real_bottle/bottle_3.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video></li>
                <li><video src="videos/real_bottle/bottle_4.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video></li>
                <li><video src="videos/real_bottle/bottle_5.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video></li>
              </ul>
            </div>
            <a class="uk-position-center-left uk-position-small uk-hidden-hover" href uk-slidenav-previous uk-slider-item="previous" aria-label="Previous demonstration"></a>
            <a class="uk-position-center-right uk-position-small uk-hidden-hover" href uk-slidenav-next uk-slider-item="next" aria-label="Next demonstration"></a>
          </div>
          <ul class="uk-slider-nav uk-dotnav uk-flex-center uk-margin-small-top"></ul>
        </div>

      - **Comparison with teleoperation without belief inference**

        <p class="uk-text-small">Direct visual comparison under the same cup-manipulation task.</p>

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-flex-middle" uk-grid>
          <div>
            <video src="videos/comparison/PATH_CUP.MOV" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video>
            <div class="uk-padding-small" style="background: #ecfdf5; border-left: 3px solid #16a34a; border-radius: 0 0 0.45rem 0.45rem;">
              <strong style="color: #15803d;">PATH (ours)</strong><br>
              <span class="uk-text-small">Belief-guided object, contact, and orientation assistance</span>
            </div>
          </div>
          <div>
            <video src="videos/comparison/TELEOP_real.mp4" loop muted playsinline preload="metadata" uk-video="autoplay:inview" class="uk-width-1-1"></video>
            <div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #64748b; border-radius: 0 0 0.45rem 0.45rem;">
              <strong style="color: #475569;">Teleoperation only</strong><br>
              <span class="uk-text-small">Operator command without belief inference</span>
            </div>
          </div>
        </div>

      ### **Hierarchical manipulation belief**

      <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-flex-middle" uk-grid>
        <div>
          <img src="hierarchical-manipulation-belief.gif" alt="Hierarchical manipulation belief animation" class="uk-width-1-1" />
        </div>
        <div>
          <video src="videos/PATH_cup_stack.mp4" loop muted playsinline uk-video="autoplay:inview" class="uk-width-1-1"></video>
        </div>
      </div>

      PATH estimates manipulation intent hierarchically, first identifying the relevant object and then its likely contact region. A separate orientation belief uses the operator's motion and scene geometry to resolve how the hand should approach the task.

      - **Object and Object-Conditioned Contact Inference**

        <div class="uk-grid-small uk-flex-middle" uk-grid>
          <div class="uk-width-1-1 uk-width-3-5@m">
            <img src="data/path_contact_advantage_trial_013.gif" alt="Object-conditioned contact advantage inference" class="uk-width-1-1" />
          </div>
          <div class="uk-width-1-1 uk-width-2-5@m uk-flex uk-flex-middle">
            <div>
              <p><strong>Motion-consistent contact evidence.</strong> PATH evaluates each object-conditioned contact against the operator's current hand motion and task feasibility, then stabilizes the evidence over time before selecting the assisted target.</p>
            </div>
          </div>
        </div>

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-margin-small-top" uk-grid>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #16a34a; border-radius: 0.45rem;"><strong>Proximity</strong><br><span class="uk-text-small">Prioritizes contact points close to the current hand position.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #2563eb; border-radius: 0.45rem;"><strong>Directional intent</strong><br><span class="uk-text-small">Rewards candidates aligned with the measured hand-motion direction.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #7c3aed; border-radius: 0.45rem;"><strong>Workspace feasibility</strong><br><span class="uk-text-small">Suppresses contact hypotheses outside the corresponding arm's reach.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #f97316; border-radius: 0.45rem;"><strong>Surface alignment</strong><br><span class="uk-text-small">Uses a reliable local normal to favor a compatible hand approach.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #64748b; border-radius: 0.45rem;"><strong>Temporal consistency</strong><br><span class="uk-text-small">Smooths and standardizes evidence to reject short-lived noisy changes.</span></div></div>
        </div>

      - **Orientation Inference**

        <div class="uk-grid-small uk-flex-middle" uk-grid>
          <div class="uk-width-1-1 uk-width-3-5@m">
            <img src="data/path_orientation_advantage_trial_013.gif" alt="Orientation-relation advantage inference" class="uk-width-1-1" />
          </div>
          <div class="uk-width-1-1 uk-width-2-5@m uk-flex uk-flex-middle">
            <div>
              <p><strong>Relation-aware orientation evidence.</strong> PATH continuously compares parallel and perpendicular hand-to-surface-normal relations, combining current alignment with the operator's rotational behavior rather than fixing one approach orientation.</p>
            </div>
          </div>
        </div>

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-margin-small-top" uk-grid>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #16a34a; border-radius: 0.45rem;"><strong>Geometric alignment</strong><br><span class="uk-text-small">Favors the relation with the smallest hand-axis to surface-normal error.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #7c3aed; border-radius: 0.45rem;"><strong>Stationary hold</strong><br><span class="uk-text-small">Keeps a well-aligned relation stable while the hand is nearly still.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #2563eb; border-radius: 0.45rem;"><strong>Convergence</strong><br><span class="uk-text-small">Rewards angular motion that actively reduces relation error.</span></div></div>
          <div><div class="uk-padding-small" style="background: #f8fafc; border-left: 3px solid #f97316; border-radius: 0.45rem;"><strong>Normal-sign invariance</strong><br><span class="uk-text-small">Uses squared alignment to remain robust when a perceived normal flips sign.</span></div></div>
        </div>

      ### **Compliant reference generation & Bimanual Control**

      - **Compliant Reference Generation**

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-flex-middle" uk-grid>
          <div>
            <img src="data/path_reference_relation_trial_013.gif" alt="PATH reference generation for trial 013" class="uk-width-1-1" />
          </div>
          <div>
            <img src="data/path_reference_relation_trial_006.gif" alt="PATH reference generation for trial 006" class="uk-width-1-1" />
          </div>
        </div>

        <div class="uk-flex uk-flex-center uk-flex-wrap uk-flex-middle uk-margin-small-top" style="gap: 1.1rem; font-size: 0.9rem;">
          <span><span style="color: #2ca25f; font-size: 1.25em;">●</span> Reference motion</span>
          <span><span style="color: #1976d2; font-size: 1.25em;">●</span> Gripper state</span>
          <span><span style="color: #f28e2b; font-size: 1.25em;">●</span> Bottle normal</span>
        </div>

        **Belief-gated shared autonomy.** PATH turns confident contact and orientation hypotheses into shared targets while retaining the operator command under uncertainty. **Target-space interpolation** and **safety-aware gating** avoid abrupt authority changes; overdamped compliant dynamics then produce smooth position and SO(3) orientation references.

      - **Bimanual Humanoid Control**

        <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m uk-flex-middle" uk-grid>
          <div>
            <img src="data/20260805_174753_static_ee_static_upper.gif" alt="G1 upper-body end-effector tracking" class="uk-width-1-1" />
          </div>
          <div class="uk-flex uk-flex-middle">
            <p class="uk-margin-remove"><strong>Joint nonlinear IK for coordinated assistance.</strong> PATH solves both 7-DoF arms together from the generated task-space references, balancing position and orientation tracking with joint-limit feasibility. <strong>Warm-started, smooth redundancy resolution</strong> regularizes the solution and penalizes inter-frame motion, yielding continuous, executable bimanual commands while locomotion remains independently controlled.</p>
          </div>
        </div>

  - title: Experiments
    text: |
      We evaluate PATH on real-world humanoid manipulation tasks.

      <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m" uk-grid>
        <div>
          <video src="videos/bottle_exp.mp4" loop muted playsinline uk-video="autoplay:inview" class="uk-width-1-1"></video>
          <span class="uk-text-meta">Bottle Opening &mdash; used for the belief-component ablation.</span>
        </div>
        <div>
          <video src="videos/cup_stacking.mp4" loop muted playsinline uk-video="autoplay:inview"></video>
          <span class="uk-text-meta">Sequential Cup Stacking &mdash; used for the teleoperation-system comparison.</span>
        </div>
      </div>

  - title: Results
    text: |
      **Contribution of the belief components on the Bottle Opening task.** Ten completed trials
      per condition, pooled across three expert operators. Completion time and end-effector path
      lengths are reported as mean $\pm$ sample standard deviation, and time improvement is
      relative to unassisted teleoperation. Results are conditioned on task completion.

      <div class="uk-overflow-auto uk-width-1-1">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr>
              <th rowspan="2">Method</th>
              <th colspan="3" class="uk-text-center">Belief components</th>
              <th colspan="2" class="uk-text-center">Task performance</th>
              <th colspan="2" class="uk-text-center">Operator effort</th>
            </tr>
            <tr>
              <th>Pos.</th><th>Ori.</th><th>Adapt. trans.</th>
              <th>Time (s) &darr;</th><th>Improvement (%) &uarr;</th>
              <th>Trans. path (m) &darr;</th><th>Rot. path (rad) &darr;</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Teleoperation</td><td></td><td></td><td></td>
              <td>39.9 &plusmn; 11.8</td><td>0.0</td><td>3.97 &plusmn; 1.41</td><td>37.49 &plusmn; 10.57</td>
            </tr>
            <tr>
              <td>Pos. belief</td><td>&#10003;</td><td></td><td></td>
              <td>35.9 &plusmn; 10.5</td><td>10.0</td><td>4.29 &plusmn; 1.62</td><td>37.24 &plusmn; 10.57</td>
            </tr>
            <tr>
              <td>Ori. belief</td><td></td><td>&#10003;</td><td></td>
              <td>37.3 &plusmn; 11.1</td><td>6.5</td><td>4.81 &plusmn; 1.64</td><td>39.12 &plusmn; 10.99</td>
            </tr>
            <tr>
              <td>PATH w/o adapt. trans.</td><td>&#10003;</td><td>&#10003;</td><td></td>
              <td>29.1 &plusmn; 8.8</td><td>27.1</td><td>3.73 &plusmn; 1.28</td><td>31.24 &plusmn; 9.60</td>
            </tr>
            <tr>
              <td>PATH w/o ori.</td><td>&#10003;</td><td></td><td>&#10003;</td>
              <td>38.3 &plusmn; 13.5</td><td>4.0</td><td>4.51 &plusmn; 1.76</td><td>38.84 &plusmn; 12.78</td>
            </tr>
            <tr>
              <td>PATH w/o pos.</td><td></td><td>&#10003;</td><td>&#10003;</td>
              <td>36.3 &plusmn; 13.3</td><td>9.0</td><td>4.55 &plusmn; 1.74</td><td>38.46 &plusmn; 13.68</td>
            </tr>
            <tr class="uk-active">
              <td><b>PATH</b></td><td>&#10003;</td><td>&#10003;</td><td>&#10003;</td>
              <td><b>26.0</b> &plusmn; 8.5</td><td><b>34.8</b></td><td><b>3.07</b> &plusmn; 1.25</td><td><b>26.51</b> &plusmn; 11.13</td>
            </tr>
          </tbody>
        </table>
      </div>

      **Comparison with existing teleoperation systems on the Sequential Cup Stacking task.** Three
      completed trials per method by one expert operator, reported as mean $\pm$ sample standard
      deviation. NJ denotes normalized jerk.

      <div class="uk-overflow-auto uk-width-1-1">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr>
              <th>Method</th>
              <th>Time (s) &darr;</th>

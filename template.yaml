abstract: |
  Humanoid teleoperation is an important tool for collecting whole-body manipulation
  demonstrations for large-scale robot learning. However, most existing systems primarily focus on
  reproducing human motion, which may be insufficient for precise manipulation because small errors
  in contact location or hand orientation can prevent successful interaction.

  We propose **PATH**, a belief-guided shared-control framework that continuously infers
  fine-grained manipulation intent from operator motion and 3-D scene geometry. PATH represents
  intent at three levels: target object, object-conditioned interaction contact, and hand approach
  orientation. A hierarchical probabilistic belief estimator maintains these hypotheses over time,
  while an ambiguity-aware transition mechanism balances temporal persistence with rapid adaptation
  to changes in operator intent. The inferred intent is converted into a smooth task-space
  reference and mapped to executable humanoid arm commands through constrained bimanual inverse
  kinematics, separating responsive intent estimation from physical reference generation.

  Real-world humanoid manipulation experiments show that PATH reduces task completion time,
  corrective end-effector motion, and trajectory jerk compared with matched teleoperation and
  conventional reference-generation baselines.

body:
  - title: Method
    text: |
      <img src="fig1.png" alt="Intent inference overview" class="uk-align-left uk-width-1-1 uk-width-1-3@m" />

      PATH assists humanoid teleoperation by continuously inferring the operator's manipulation
      intent and using it to refine the commanded hand motion. The framework consists of
      probabilistic manipulation intent inference, belief-guided shared reference generation, and
      bimanual humanoid control. It infers object, contact, and orientation intent from operator
      motion and 3-D scene geometry, converts the inferred intent into a smooth task-space
      reference, and executes it through bimanual inverse kinematics.

      #### Hierarchical manipulation belief

      At time $t$, let $\mathcal{G}_t=\{g_i\}_{i=1}^{N_g}$ denote the candidate objects,
      $\mathcal{C}_i=\{c_{i,j}\}_{j=1}^{N_i}$ the contact candidates associated with object $g_i$,
      and $\mathcal{O}_t=\{o_k\}_{k=1}^{N_o}$ the orientation hypotheses. An object label alone
      does not fully specify a manipulation, since a single object may admit multiple contact
      regions. We therefore factor position intent into an object belief and an object-conditioned
      contact belief,

      $$b_t(g,c) = b_t(g)\,b_t(c\mid g),$$

      while maintaining a separate orientation belief $b_t(o)$. This factorization restricts
      contact competition to candidates belonging to the same object. The orientation belief is
      independent because the manipulated object and the geometric reference defining the desired
      hand orientation need not be the same.

      #### Object and contact evidence

      For a position hypothesis $h\in\mathcal{G}_t\cup\mathcal{C}_i$, compatibility with the
      current operator motion is evaluated by

      $$A(h) = w_x A_{\mathrm{prox}}(h) + w_d A_{\mathrm{dir}}(h) + w_r A_{\mathrm{reach}}(h) + w_{\ell} A_{\mathrm{align}}(h).$$

      The proximity term is $A_{\mathrm{prox}}(h)=\exp(-\|\mathbf{p}_t-\mathbf{x}(h)\|/d_0)$ and the
      direction term is $A_{\mathrm{dir}}(h)=\hat{\mathbf{v}}_t^{\top}\hat{\mathbf{d}}_h$, disabled
      below a minimum hand speed. $A_{\mathrm{reach}}(h)$ penalizes hypotheses outside the arm
      workspace, and $A_{\mathrm{align}}(h)$ measures agreement between the hand approach axis and
      the contact surface normal where the local surface estimate is reliable. Advantages are
      temporally smoothed and robustly standardized across the active hypotheses of each set.

      #### Orientation evidence

      Each orientation hypothesis $o_k=(s_k,\mathrm{rel}_k)$ associates a persistent planar
      primitive $s_k$, with unit normal $\hat{\mathbf{n}}(s_k)$, with a desired relation
      $\mathrm{rel}_k\in\{\textsf{par},\textsf{perp}\}$. With
      $\mu_t(o)=\hat{\mathbf{h}}_t^{\top}\hat{\mathbf{n}}(s)$ for the hand approach axis
      $\hat{\mathbf{h}}_t$, the relation error is

      $$e_t(o)=\begin{cases}1-\mu_t(o)^2, & \mathrm{rel}=\textsf{par},\\ \mu_t(o)^2, & \mathrm{rel}=\textsf{perp}.\end{cases}$$

      The error vanishes when the desired geometric relation is satisfied, and the squared form is
      invariant to the sign of the estimated plane normal. The orientation advantage combines a
      robust alignment loss, a persistence term active while the hand is nearly stationary, and a
      convergence term computed from the alignment derivative
      $\dot{\mu}_t(o)=(\boldsymbol{\omega}_t\times\hat{\mathbf{h}}_t)^{\top}\hat{\mathbf{n}}(s)$:

      $$A_{\mathrm{ori}}(o) = -\ell\!\left(e_t(o)\right) + w_{\mathrm{hold}}\left(1-e_t(o)\right)\mathbf{1}\!\left[\|\boldsymbol{\omega}_t\|<\omega_{\min}\right] - \frac{w_{\mathrm{conv}}}{\omega_{\mathrm{ref}}}\dot e_t(o).$$

      #### Ambiguity-aware transition and belief update

      Given the previous belief $\mathbf{b}_{t-1}$ and processed evidence
      $\widetilde{\mathbf{A}}_t$, disagreement among currently plausible hypotheses is quantified
      by the belief-weighted evidence dispersion:

      $$\bar A_t^{b}=\sum_k b_{t-1,k}\widetilde A_{t,k},\qquad D_t=\sum_k b_{t-1,k}\left(\widetilde A_{t,k}-\bar A_t^{b}\right)^2,$$

      $$\lambda_t=\lambda_0+\kappa D_t,\qquad \rho_t=\operatorname{clip}(\lambda_t\Delta t,0,1).$$

      A large $D_t$ indicates that plausible hypotheses receive inconsistent evidence, and is
      therefore treated as a cue for faster belief redistribution. The belief follows a
      predict&ndash;correct recursion,

      $$\mathbf{b}_t^{-}=\left[(1-\rho_t)\mathbf{P}_0+\rho_t\boldsymbol{\Pi}_{\mathrm{sw}}^{\top}\right]\mathbf{b}_{t-1},$$

      $$\mathbf{b}_t=\operatorname{softmax}\!\left(\log\mathbf{b}_t^{-}+\beta\widetilde{\mathbf{A}}_t\Delta t\right),$$

      where $\mathbf{P}_0$ and $\boldsymbol{\Pi}_{\mathrm{sw}}$ are the persistence and switching
      transitions and $\beta$ is the inverse temperature of the Boltzmann-rational correction. The
      recursion is applied to $\mathcal{G}_t$, each $\mathcal{C}_i$, and $\mathcal{O}_t$, and the
      selected intent is taken as the maximizer of each belief.

      #### Belief-guided shared reference generation

      The selected contact defines the position target when it satisfies the workspace and validity
      conditions and the hand is not currently holding an object; otherwise the operator command is
      retained. Rather than replacing the operator orientation, the assisted orientation target
      interpolates toward the relation-consistent orientation,

      $$\mathbf{R}_t^{\mathrm{tgt}}=\operatorname{Slerp}\!\left(\mathbf{R}_t^{\mathrm{cmd}},\mathbf{R}_t^{\mathrm{rel}};w_t\right),\qquad w_t=w_t^{\mathrm{belief}}w_t^{\mathrm{gate}}\in[0,1],$$

      where $w_t^{\mathrm{belief}}$ is a hysteresis-smoothed function of posterior confidence and
      $w_t^{\mathrm{gate}}$ suppresses assistance for temporally inconsistent detections, excessive
      angular displacement, or discontinuous target motion. Interpolation acts on the target rather
      than on the commanded reference, so that rapid changes in assistance authority do not
      directly produce a discontinuity in reference velocity.

      For the position error $\mathbf{e}_t^{p}$ and the orientation error
      $\mathbf{e}_t^{R}=\log_{\mathrm{SO}(3)}(\mathbf{R}_t^{\mathrm{ref}}\mathbf{R}_t^{\mathrm{tgt}\top})$,
      the reference evolves as a critically over-damped second-order system,

      $$\ddot{\boldsymbol{\xi}}_t+2\zeta\omega_n\dot{\boldsymbol{\xi}}_t+\omega_n^2\boldsymbol{\xi}_t=\mathbf{0},\qquad \zeta>1,$$

      acting on $\mathbb{R}^3$ for position and on $\mathfrak{so}(3)$ for orientation. The target is
      held constant over each control interval and the reference is propagated using the exact
      discrete transition of the second-order system.

      #### Bimanual humanoid control

      Task-space references are converted into joint commands by solving a nonlinear
      inverse-kinematics problem over both arms jointly, with
      $\mathbf{q}\in\mathbb{R}^{14}$ the bimanual arm joint vector:

      $$\mathbf{q}_t^\star=\arg\min_{\mathbf{q}}\sum_{i\in\{L,R\}}\Big(w_p\|\mathbf{e}_i^{p}\|_2^2+w_R\|\mathbf{e}_i^{R}\|_2^2\Big)+w_{\mathrm{reg}}\|\mathbf{q}\|_2^2+w_{\mathrm{smooth}}\|\mathbf{q}-\mathbf{q}_{t-1}^\star\|_2^2$$

      subject to the joint limits $\mathbf{q}^{-}\le\mathbf{q}\le\mathbf{q}^{+}$. The problem is
      solved with IPOPT at every control step, warm-started from $\mathbf{q}_{t-1}^{\star}$. The
      regularization resolves the redundancy of each seven-DoF arm, while the temporal term favors
      the least-displaced solution between consecutive control steps. The lower body is controlled
      independently by the whole-body locomotion controller.


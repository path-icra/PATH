title: 'PATH: Probabilistic Assistance for Teleoperation of Humanoids'
journal: "ICRA'27"
description: Shared autonomy for humanoid teleoperation via probabilistic intent inference and compliant reference generation.

# Set these to the public page URL once the repo is live.

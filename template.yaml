  - title: Results
    text: |
      **Contribution of the belief components on the Bottle Opening task.** Ten completed trials
      per condition, pooled across three expert operators. Completion time and end-effector path
      lengths are reported as mean $\pm$ sample standard deviation, and time improvement is
      relative to unassisted teleoperation. Results are conditioned on task completion.


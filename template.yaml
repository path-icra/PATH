abstract: |
  Teleoperating humanoid robots for **contact-rich manipulation** is difficult: the operator must
  simultaneously reason about object geometry, contact state, and the imprecision of their own
  control inputs. We present **PATH**, a shared-autonomy framework that infers operator intent
  through probabilistic belief estimation over object pose and contact state, and generates
  compliant reference motions that assist the operator without overriding their authority.

  Belief is conditioned on the operator's command rather than on robot feedback, which avoids
  self-confirming feedback loops, and a layered sensing architecture separates coarse object and
  orientation belief from fine contact belief. We evaluate PATH on a humanoid platform across three
  contact-rich manipulation tasks and observe consistent improvements over teleoperation and
  arbitration baselines.

body:
  - title: Method
    text: |
      <div class="uk-grid-small uk-flex-middle uk-child-width-1-1 uk-child-width-1-2@m" uk-grid>
        <div>
          <img src="fig1.png" alt="Belief-space shared control overview" class="uk-width-1-1" />
          <span class="uk-text-meta">Fig. 1 &mdash; caption goes here.</span>
        </div>
        <div>
          <p>PATH couples belief estimation over object and contact state with a compliant reference
          generator, arbitrating authority between operator and assistance continuously rather than
          through discrete mode switches.</p>

          <h4>Layered sensing</h4>
          <p>A head-mounted RGB-D camera supports object and orientation belief; wrist-mounted RGB-D
          cameras support contact belief.</p>

          <h4>Belief input source</h4>
          <p>Belief is conditioned on the operator's command rather than robot forward kinematics,
          which prevents self-confirming feedback.</p>

          <h4>Reference generation</h4>
          <p>Position authority is suppressed while an object is held; orientation blends
          continuously through confidence-weighted interpolation.</p>

          <h4>Grasp transition</h4>
          <p>Jaw-stall and co-motion detection with operator-frame rebasing removes discontinuities
          when authority is released.</p>
        </div>
      </div>

